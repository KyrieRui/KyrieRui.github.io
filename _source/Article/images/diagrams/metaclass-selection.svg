<svg xmlns="http://www.w3.org/2000/svg" class="diagram" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc" lang="en">
<title id="title">How Python 3 chooses a metaclass</title><desc id="desc">Set with the metaclass argument, or worked out from the base classes.</desc>
<style>
 .diagram { --paper:#ffffff; --panel:#f5f7fa; --cell:#ffffff; --ink:#1c293b; --muted:#64748b; --line:#63758c; --border:#c5cfdd; }
 @media (prefers-color-scheme:dark) {
 .diagram { --paper:#0c1523; --panel:#142133; --cell:#0e1929; --ink:#edf2f8; --muted:#a7b5c8; --line:#bdc9d9; --border:#465a74; }
 }
 text { font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif; fill:var(--ink); }
 .title { font-size:28px; font-weight:650; }
 .subtitle { font-size:17px; fill:var(--muted); }
 .label { font-size:17px; font-weight:550; }
 .small { font-size:15px; fill:var(--muted); }
 .mono { font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace; }
 .code { font-size:20px; }
 .value { font-size:27px; font-weight:550; }
 .paper { fill:var(--paper); }
 .panel { fill:var(--panel); stroke:var(--border); stroke-width:1; }
 .node { fill:var(--cell); stroke:var(--line); stroke-width:1.7; }
 .arrow { fill:none; stroke:var(--line); stroke-width:2; }
 .divider { fill:none; stroke:var(--border); stroke-width:1; }

 .body {font-size:18px;} .heading {font-size:22px;font-weight:600;} .note {font-size:16px;fill:var(--muted);}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" class="arrow"/></marker></defs>
<rect width="720" height="900" rx="12" class="paper"/>
<text x="32" y="47" class="title" text-anchor="start">How Python 3 chooses a metaclass</text><text x="32" y="78" class="subtitle" text-anchor="start">Set with the metaclass argument, or worked out from the base classes.</text><rect x="100" y="114" width="520" height="62" rx="8" class="node"/><text x="360.0" y="151.0" class="body" text-anchor="middle">Run the class statement (Python 3)</text><path d="M360 176 V200" class="arrow" marker-end="url(#arrow)"/><path d="M360 200.0 L500.0 270 L360 340.0 L220.0 270 Z" class="node"/><text x="360" y="264.0" class="body" text-anchor="middle">Explicit metaclass given,</text><text x="360" y="288.0" class="body" text-anchor="middle">and not a type instance?</text><path d="M220 270 H164 V394" class="arrow" marker-end="url(#arrow)"/><text x="174" y="307" class="small" text-anchor="start">Yes</text><path d="M500 270 H544 V394" class="arrow" marker-end="url(#arrow)"/><text x="556" y="307" class="small" text-anchor="start">No</text><rect x="32" y="394" width="264" height="70" rx="8" class="node"/><text x="164.0" y="435.0" class="body" text-anchor="middle">Use the explicit metaclass</text><rect x="400" y="394" width="288" height="78" rx="8" class="node"/><text x="544.0" y="426.5" class="body" text-anchor="middle">Collect the explicit metaclass</text><text x="544.0" y="451.5" class="body" text-anchor="middle">and base classes&#x27; metaclasses</text><path d="M544 472 V510" class="arrow" marker-end="url(#arrow)"/><path d="M544 510.0 L676.0 575 L544 640.0 L412.0 575 Z" class="node"/><text x="544" y="569.0" class="body" text-anchor="middle">Is there a compatible</text><text x="544" y="593.0" class="body" text-anchor="middle">most-derived metaclass?</text><path d="M412 575 H296" class="arrow" marker-end="url(#arrow)"/><text x="352" y="556" class="small" text-anchor="middle">Yes</text><rect x="32" y="540" width="264" height="70" rx="8" class="node"/><text x="164.0" y="581.0" class="body" text-anchor="middle">Choose that metaclass</text><path d="M544 640 V720" class="arrow" marker-end="url(#arrow)"/><text x="560" y="682" class="small" text-anchor="start">No</text><rect x="400" y="720" width="288" height="70" rx="8" class="node"/><text x="544.0" y="761.0" class="code" text-anchor="middle">Raise TypeError</text><path d="M164 610 V720" class="arrow" marker-end="url(#arrow)"/><path d="M32 429 H16 V755 H32" class="arrow" marker-end="url(#arrow)"/><rect x="32" y="720" width="264" height="70" rx="8" class="node"/><text x="164.0" y="748.5" class="body" text-anchor="middle">Prepare the namespace</text><text x="164.0" y="773.5" class="body" text-anchor="middle">Run body, create class</text><text x="32" y="835" class="note" text-anchor="start">With no bases and no metaclass given, type is used.</text><text x="32" y="864" class="note" text-anchor="start">Assigning __metaclass__ in the class body does not set a metaclass in Python 3.</text></svg>