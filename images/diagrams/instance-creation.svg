<svg xmlns="http://www.w3.org/2000/svg" class="diagram" width="720" height="770" viewBox="0 0 720 770" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Creating and initialising an instance</title><desc id="desc">Usually the object is created, then initialised; other return types skip __init__.</desc>
<style>
 .diagram { --paper:#ffffff; --panel:#f5f7fa; --cell:#ffffff; --ink:#1c293b; --muted:#64748b; --line:#63758c; --border:#c5cfdd; }
 @media (prefers-color-scheme:dark) {
 .diagram { --paper:#0c1523; --panel:#142133; --cell:#0e1929; --ink:#edf2f8; --muted:#a7b5c8; --line:#bdc9d9; --border:#465a74; }
 }
 text { font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif; fill:var(--ink); }
 .title { font-size:28px; font-weight:650; }
 .subtitle { font-size:17px; fill:var(--muted); }
 .label { font-size:17px; font-weight:550; }
 .small { font-size:15px; fill:var(--muted); }
 .mono { font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace; }
 .code { font-size:20px; }
 .value { font-size:27px; font-weight:550; }
 .paper { fill:var(--paper); }
 .panel { fill:var(--panel); stroke:var(--border); stroke-width:1; }
 .node { fill:var(--cell); stroke:var(--line); stroke-width:1.7; }
 .arrow { fill:none; stroke:var(--line); stroke-width:2; }
 .divider { fill:none; stroke:var(--border); stroke-width:1; }

 .body {font-size:18px;} .heading {font-size:22px;font-weight:600;} .note {font-size:16px;fill:var(--muted);}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" class="arrow"/></marker></defs>
<rect width="720" height="770" rx="12" class="paper"/>
<text x="32" y="47" class="title" text-anchor="start">Creating and initialising an instance</text><text x="32" y="78" class="subtitle" text-anchor="start">Usually the object is created, then initialised; other return types skip __init__.</text><rect x="120" y="116" width="480" height="62" rx="8" class="node"/><text x="360.0" y="153.0" class="mono code" text-anchor="middle">User(&#x27;Two Drops&#x27;, 23)</text><path d="M360 178 V216" class="arrow" marker-end="url(#arrow)"/><rect x="200" y="216" width="320" height="62" rx="8" class="node"/><text x="360.0" y="253.0" class="code" text-anchor="middle">__new__ returns an object</text><path d="M360 278 V310" class="arrow" marker-end="url(#arrow)"/><path d="M360 310.0 L490.0 375 L360 440.0 L230.0 375 Z" class="node"/><text x="360" y="369.0" class="body" text-anchor="middle">Is it an instance of</text><text x="360" y="393.0" class="body" text-anchor="middle">this class or a subclass?</text><path d="M360 440 V505" class="arrow" marker-end="url(#arrow)"/><text x="380" y="480" class="small" text-anchor="start">Yes</text><rect x="200" y="505" width="320" height="70" rx="8" class="node"/><text x="360.0" y="533.5" class="body" text-anchor="middle">Call __init__</text><text x="360.0" y="558.5" class="body" text-anchor="middle">Initialise the instance</text><path d="M360 575 V615" class="arrow" marker-end="url(#arrow)"/><path d="M490 375 H646 V648 H480" class="arrow" marker-end="url(#arrow)"/><text x="546" y="357" class="small" text-anchor="middle">No</text><rect x="240" y="615" width="240" height="66" rx="8" class="node"/><text x="360.0" y="654.0" class="body" text-anchor="middle">Return the object</text><text x="360" y="731" class="subtitle" text-anchor="middle">__init__ initialises; it does not return the instance.</text></svg>